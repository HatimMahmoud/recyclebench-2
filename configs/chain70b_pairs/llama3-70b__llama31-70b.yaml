# configs/chain70b.yaml -- the 70B chain. Generated from configs/llama4_pegasus.yaml: only `lineage:` and the four
# 70B `real:` entries differ; every science setting (judges, gate, seed, budgets, transform classes) is identical.
# =====================================================================
# real_llama_lineage_all.yaml + Llama 4 Scout, for the DFKI Pegasus cluster (pegasus/README.md).
#
# Identical seed / judges / gate / transform_classes / budget to real_llama_lineage_all.yaml, so
# the six existing models hit the shared cache and only llama4-scout generates. Scout (Q4_K_M,
# 67 GB) needs an 80 GB GPU on its own; it does not fit on the Mac. This rung is post hoc
# (not in prereg.md / Amendment 1) and scale-confounded (109B MoE vs <=13B dense): exploratory.
#   ollama pull llama4:17b-scout-16e-instruct-q4_K_M   # Llama-4-Scout-17B-16E-Instruct (~67 GB)
#   ollama pull llama4:17b-maverick-128e-instruct-q4_K_M   # Llama-4-Maverick-17B-128E-Instruct (~245 GB,
#   one node with >= 3 GPUs: 3x RTXB6000 96 GB or 4x A100/H100 80 GB). Same caveats as Scout.
#
# Original header (real_llama_lineage_all.yaml):
# REAL cross-generational lineage on Ollama — ALL <70B instruct models.
#
# Extends real_llama_lineage.yaml to the full local roster so one shared cache
# holds every model's canonical screen. Ollama serves one model at a time, so a
# sequential run (run_all_models.sh) walks this lineage, screening each model once
# across every benchmark; every pair's 2x2 is then a free cache-diff.
#
# Prereqs (pull each once; ~70B models are intentionally excluded):
#   ollama pull llama2:7b        # Llama-2-7b-chat        (~3.8 GB)
#   ollama pull llama2:13b       # Llama-2-13b-chat       (~7.4 GB)
#   ollama pull llama3:8b        # Llama-3-8b-instruct    (~4.7 GB)
#   ollama pull llama3.1:8b      # Llama-3.1-8b-instruct  (~4.7 GB)
#   ollama pull llama3.2:1b      # Llama-3.2-1b-instruct  (~1.3 GB)
#   ollama pull llama3.2:3b      # Llama-3.2-3b-instruct  (~2.0 GB)
#   ollama pull qwen2.5:3b       # decorrelated paraphraser
#
# Keep these cfg KEYS stable (llama2-7b, llama3-8b, …): the cache is keyed by the
# cfg key, not the model-id, so reusing the same keys reuses the existing cache.
# =====================================================================
seed: 20260101

lineage:               # one matched 70B pair (run-real pairs adjacent rungs only)
  - llama3-70b
  - llama31-70b

real:
  llama2-70b:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: llama2:70b
    temperature: 0.0
    max_tokens: 512
    timeout: 1800.0    # first call loads ~40 GB from /netscratch
  llama3-70b:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: llama3:70b
    temperature: 0.0
    max_tokens: 512
    timeout: 1800.0    # first call loads ~40 GB from /netscratch
  llama31-70b:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: llama3.1:70b
    temperature: 0.0
    max_tokens: 512
    timeout: 1800.0    # first call loads ~40 GB from /netscratch
  llama33-70b:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: llama3.3:70b
    temperature: 0.0
    max_tokens: 512
    timeout: 1800.0    # first call loads ~40 GB from /netscratch
  llama2-7b:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: llama2:7b
    temperature: 0.0
    max_tokens: 512
  llama2-13b:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: llama2:13b
    temperature: 0.0
    max_tokens: 512
  llama3-8b:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: llama3:8b
    temperature: 0.0
    max_tokens: 512
  llama31-8b:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: llama3.1:8b
    temperature: 0.0
    max_tokens: 512
  llama32-1b:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: llama3.2:1b
    temperature: 0.0
    max_tokens: 512
  llama32-3b:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: llama3.2:3b
    temperature: 0.0
    max_tokens: 512
  llama4-scout:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: llama4:17b-scout-16e-instruct-q4_K_M   # = llama4:scout, pinned to its quantisation
    temperature: 0.0
    max_tokens: 512
    timeout: 600.0     # first call loads 67 GB from /netscratch
  llama4-maverick:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: llama4:17b-maverick-128e-instruct-q4_K_M   # = llama4:maverick (sha256:ecdedd393ed1), 245 GB
    temperature: 0.0
    max_tokens: 512
    timeout: 1800.0    # first call loads 245 GB from /netscratch (~20 min)

# offline RuleBasedJudge fallback (no 'judges:' block) — pilot-grade screening.
# A headline needs a calibrated non-Llama judge (add judges: + judge-export/ingest).

paraphraser:
  provider: openai_compatible
  base_url: http://localhost:11434/v1
  model_id: qwen2.5:3b        # non-Llama -> decorrelated from the target lineage
  temperature: 0.7
  max_tokens: 256

gate:
  cosine: 0.75
  bertscore: 0.85
  nli_entail: 0.60
  llm_intent: 0.50

budget:
  k_canonical_samples: 3
  paraphrases_per_behaviour: 8
  samples_per_variant: 1

decision:
  min_p_minus: 30
  pi_star: 0.15
  kappa_floor: 0.60
  delta_util: 0.05

store_raw: false

# --- added so the lineage recycle run matches the calibrated anchor ---
transform_classes:
  - paraphrase
  - syntactic
  - lexical
  - back_translation
  - tense_shift
  - register

judges:
  rubric:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_id: qwen2.5:14b
    temperature: 0.0
    max_tokens: 4
